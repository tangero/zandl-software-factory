# Testy nástěnky (složka nastenka/) včetně kontraktu s bránou, proto běží i při změně pravidla.mjs.
# V projektovém repozitáři bez složky nastenka/ krok jen ohlásí, že není co testovat. Spouští kód z PR, proto jen se čtecím oprávněním a bez tajemství.
name: Testy nástěnky

on:
  pull_request:
    paths: ["nastenka/**", ".github/brana/pravidla.mjs"]
  push:
    branches: [main]
    paths: ["nastenka/**", ".github/brana/pravidla.mjs"]

permissions:
  contents: read

jobs:
  testy:
    name: Testy nástěnky
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testy
        run: |
          if [ -d nastenka/test ]; then node --test 'nastenka/test/*.test.mjs'; else echo "Nástěnka v tomto repozitáři není."; fi
